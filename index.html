<script>
// ============================ SETTINGS ============================
const CONFIG = {
  daysAhead: 14,        // show courses from today up to this many days ahead
  maxCourses: 5,        // at most this many rows
  refreshMinutes: 30,   // reload the data file this often
  emptyText: "No courses in the next two weeks.",
};
// Table geometry, matched to the original slide
const FIRST_ROW_TOP = 408, ROW_HEIGHT = 80.5;
// ==================================================================

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = `scale(${s})`;
}
addEventListener("resize", fit); fit();

function zurichToday() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Zurich",
    year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return `${g("year")}-${g("month")}-${g("day")}`;
}
function addDays(iso, n) {
  return new Date(new Date(iso + "T12:00:00Z").getTime() + n * 86400000).toISOString().slice(0, 10);
}
const swissDate = iso => iso.split("-").reverse().join(".");

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text; return d;
}

function render(data) {
  const today = zurichToday(), until = addDays(today, CONFIG.daysAhead);
  const list = (data.courses || [])
    .filter(c => c.date >= today && c.date <= until)
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))
    .slice(0, CONFIG.maxCourses);

  const stage = document.getElementById("rows");
  stage.innerHTML = "";
  if (!list.length) { stage.append(el("empty", CONFIG.emptyText)); return; }

  list.forEach((c, i) => {
    const row = el("row", "");
    row.style.top = (FIRST_ROW_TOP + i * ROW_HEIGHT) + "px";
    const title = el("title", c.title);
    row.append(el("date", swissDate(c.date)), title, el("dur", c.duration), el("online", c.online ? "yes" : "no"));
    stage.append(row);
    // Shrink very long titles so they fit their column
    let size = 27;
    while (title.scrollWidth > title.clientWidth && size > 18) title.style.fontSize = (--size) + "px";
  });
}

const CACHE_KEY = "libraryCoursesCache";
async function load() {
  try {
    const res = await fetch("courses.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    render(data);
  } catch (e) {
    // Offline or error: show the last good data
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c) render(c); } catch (e2) {}
  }
}
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c) render(c); } catch (e) {}
load();
setInterval(load, CONFIG.refreshMinutes * 60 * 1000);
</script>
